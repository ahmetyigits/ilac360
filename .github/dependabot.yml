# Aylık bağımlılık güncelleme PR'ları — tek kişilik bakım akışına uygun:
# minor+patch tek PR'da gruplanır, major ayrı PR olarak gelir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      minor-ve-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-ve-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
