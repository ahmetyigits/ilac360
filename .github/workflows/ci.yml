name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # LFS bant genişliği koruması: 55 MB dataset her koşuda GitHub LFS'ten
      # İNDİRİLMEZ (aylık 1 GB kota ~18 koşuda biterdi). Obje önce cache'ten
      # gelir; yalnız dataset değiştiğinde (OID değişince) LFS'e gidilir.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS dosya kimliklerini çıkar
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: LFS pull (cache miss'te indirir, hit'te checkout eder)
        run: git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      # Bilgi amaçlı güvenlik denetimi — kapı değil (continue-on-error).
      - name: npm audit (bilgilendirme)
        run: npm audit --prefix client --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm --prefix client run lint

      - name: Build data files
        run: node scripts/build-data.mjs

      - name: Smoke test (data integrity)
        run: node scripts/smoke-test.mjs

      - name: Lint rules
        run: node scripts/lint-rules.mjs

      - name: Rules coverage gate
        run: node scripts/rules-coverage.mjs --min 95

      - name: Unit tests
        run: npm --prefix client run test

      - name: Build client
        run: npm --prefix client run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 7
